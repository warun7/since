# Typecheck and the offline unit tests on every push and pull request. No API key needed:
# the tests make no network calls. (The evals call DeepSeek, so they run by hand.)
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
